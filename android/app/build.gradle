plugins {
    id 'com.android.application'
}

/* Номер сборки берём из общего version.json — чтобы приложение, сайт и
   репозиторий всегда говорили об одной и той же версии игры. */
def gameVersion = { ->
    def f = file("${rootDir}/../version.json")
    if (!f.exists()) return [name: '1.0.0', code: 1]
    def t = f.getText('UTF-8')
    def n = (t =~ /"version"\s*:\s*"([^"]+)"/)
    def c = (t =~ /"build"\s*:\s*(\d+)/)
    return [name: n ? n[0][1] : '1.0.0', code: c ? (c[0][1] as int) : 1]
}()

android {
    namespace 'io.akvapark.game'
    compileSdk 34

    defaultConfig {
        applicationId "io.akvapark.game"
        minSdk 24
        targetSdk 34
        versionCode gameVersion.code
        versionName gameVersion.name

        buildConfigField "String", "UPDATE_BASE", "\"https://akvapark.45.67.216.36.sslip.io/\""
        buildConfigField "int",    "GAME_BUILD",  "${gameVersion.code}"
    }

    signingConfigs {
        release {
            // Ключ создаётся один раз скриптом server/build-apk.sh и живёт вне репозитория:
            // потеряешь его — обновление поверх установленной игры перестанет ставиться.
            def props = new Properties()
            def f = file("${rootDir}/keystore.properties")
            if (f.exists()) {
                props.load(new FileInputStream(f))
                storeFile file(props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig file("${rootDir}/keystore.properties").exists() ? signingConfigs.release : null
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources.excludes += ['META-INF/*']
    }
}

dependencies {
    // androidx тянет kotlin-stdlib разных версий, и jdk7/jdk8-обломки старых
    // версий дублируют классы новой. BOM сводит их к одной версии.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.9.24')

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
}

/* Игра — один файл, он кладётся в app/src/main/assets/game/ скриптом
   server/build-apk.sh ещё до запуска Gradle. Специально не задачей Gradle:
   генерируемая папка ассетов ссорится с проверками порядка задач, а копия
   двух файлов такой сложности не стоит.
   Проверяем только, что файл на месте — иначе получился бы apk без игры. */
tasks.named('preBuild').configure {
    doFirst {
        def game = file("${projectDir}/src/main/assets/game/index.html")
        if (!game.exists() || game.length() < 50000) {
            throw new GradleException(
                "Нет игры в assets: ${game}. Запускай сборку через server/build-apk.sh")
        }
    }
}
