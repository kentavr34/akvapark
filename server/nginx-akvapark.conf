# ==========================================================================
#  Заброшенный аквапарк — отдельный сайт на сервере №2 (45.67.216.36).
#  Живёт сам по себе: свой каталог /opt/akvapark, свой порт, свой лог.
#  Другие проекты сервера (chesscoin, jobtop) не затрагиваются.
#
#  Ставится как /etc/nginx/sites-available/akvapark + симлинк в sites-enabled.
# ==========================================================================

# ---- общие правила отдачи (подключаются в оба server-блока) ----
# index.html, sw.js и version.json НИКОГДА не кешируются браузером —
# иначе игрок останется на старой сборке и «обновление» не приедет.

server {
    listen 8090;
    listen [::]:8090;
    server_name _;

    root /opt/akvapark/www;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/akvapark.access.log;
    error_log  /var/log/nginx/akvapark.error.log;

    include /etc/nginx/snippets/akvapark-common.conf;
}

server {
    listen 80;
    listen [::]:80;
    server_name akvapark.45.67.216.36.sslip.io;

    root /opt/akvapark/www;
    charset utf-8;

    # продление сертификата ходит сюда — не редиректим
    location ^~ /.well-known/acme-challenge/ { root /opt/akvapark/www; }

    location / { return 301 https://$host$request_uri; }
}

# Основной адрес игры. HTTPS обязателен: без него браузер не даёт
# ни офлайн-режима, ни установки игры на телефон ярлыком.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name akvapark.45.67.216.36.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/akvapark/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/akvapark/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:akva_ssl:5m;
    ssl_session_timeout 1h;

    root /opt/akvapark/www;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/akvapark.access.log;
    error_log  /var/log/nginx/akvapark.error.log;

    include /etc/nginx/snippets/akvapark-common.conf;
}
