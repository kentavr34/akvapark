# общая часть сайта игры: кеширование, сжатие, безопасность
# ставится в /etc/nginx/snippets/akvapark-common.conf

gzip on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types text/css application/javascript application/json
           application/manifest+json image/svg+xml;

add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer-when-downgrade always;

# ---- то, что определяет свежесть игры: только из сети ----
location = /version.json {
    add_header Cache-Control "no-store, must-revalidate" always;
    add_header Access-Control-Allow-Origin "*" always;
    default_type application/json;
}
location = /sw.js {
    add_header Cache-Control "no-store, must-revalidate" always;
    add_header Service-Worker-Allowed "/" always;
    default_type application/javascript;
}
location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate" always;
}
location = /landing.html {
    add_header Cache-Control "no-cache, must-revalidate" always;
}
# Корень сайта — витрина с тремя вариантами (играть/Android/Windows).
# Сама игра как открывалась по /index.html, так и открывается — ссылки,
# PWA-ярлык и автообновление Android-приложения это адрес не меняют.
location = / {
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files /landing.html /index.html =404;
}
location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
}

# ---- APK для Android ----
location = /akvapark.apk {
    alias /opt/akvapark/dist/akvapark.apk;
    default_type application/vnd.android.package-archive;
    add_header Content-Disposition 'attachment; filename="akvapark.apk"' always;
    add_header Cache-Control "no-cache" always;
}
# связь сайта с приложением: по ней браузер узнаёт установленную игру
location = /.well-known/assetlinks.json {
    alias /opt/akvapark/dist/assetlinks.json;
    default_type application/json;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "public, max-age=3600" always;
}
# метаданные апк — по ним приложение понимает, что вышла новая версия
location = /apk.json {
    alias /opt/akvapark/dist/apk.json;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header Access-Control-Allow-Origin "*" always;
}

# ---- синхронизация профиля игрока: маленький API-сервис на localhost ----
# (см. server/api/server.js + server/akvapark-api.service). У сервиса уже
# есть свой лимит частоты запросов внутри — здесь просто проксируем.
location /api/ {
    proxy_pass http://127.0.0.1:8091;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    client_max_body_size 64k;
    proxy_read_timeout 10s;
}

# ---- иконки и статика: кешируем надолго ----
location ~* \.(png|jpg|jpeg|webp|svg|ico|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000" always;
}

# ---- служебное наружу не отдаём ----
location ~ /\.(git|github) { deny all; return 404; }
location ~ ^/(android|tools|server)/ { deny all; return 404; }

location / {
    try_files $uri $uri/ /index.html;
}
